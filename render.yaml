# Render Blueprint — CampusCheck web app (Vite SPA, static site).
# Builds ./dist and rewrites all client routes to index.html so React Router
# works on hard refresh / deep links. Full guide: docs/DEPLOY.md
#
# ⚠ Two values are environment-specific and MUST be set before auth/API work:
#   1. VITE_API_BASE_URL  — set in the Render dashboard (sync: false below).
#   2. The Content-Security-Policy `connect-src` — edit the placeholder below to
#      your backend origin, or the browser will block every API call.

services:
  - type: web
    name: campuscheck-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true

    envVars:
      # Build-time only — every VITE_* var is inlined into the bundle at build.
      - key: VITE_API_BASE_URL
        sync: false # set in dashboard: https URL of the ATMs backend, no trailing slash
      - key: VITE_INSTITUTION_ID
        sync: false # set in dashboard: the institution UUID
      - key: VITE_APP_NAME
        value: CampusCheck
      - key: VITE_USE_MOCKS
        value: "false"
      - key: NODE_VERSION
        value: "22.11.0"

    routes:
      # SPA fallback: existing static files are served first; everything else
      # falls back to index.html for client-side routing.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: geolocation=(self), camera=(), microphone=()
      - path: /*
        name: Content-Security-Policy
        # Replace https://your-atms-api.onrender.com in connect-src with your
        # backend origin (must match VITE_API_BASE_URL). Keep 'self' for same-origin.
        value: >-
          default-src 'self';
          script-src 'self';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data:;
          font-src 'self';
          connect-src 'self' https://your-atms-api.onrender.com;
          object-src 'none';
          base-uri 'self';
          frame-ancestors 'none'
